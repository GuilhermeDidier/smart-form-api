<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Software Engineer — Job Application</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      padding: 40px 16px;
    }
    .container { max-width: 680px; margin: 0 auto; }
    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      padding: 32px;
      margin-bottom: 20px;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { font-size: 14px; color: #666; margin-bottom: 28px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 5px;
      color: #444;
    }
    label .req { color: #e53e3e; margin-left: 2px; }
    input, select, textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      color: #333;
      background: #fff;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus { border-color: #3b82f6; }
    textarea { resize: vertical; min-height: 100px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 500px) { .row { grid-template-columns: 1fr; } }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #9ca3af;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #f0f0f0;
    }
    button[type="submit"] {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 11px 28px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button[type="submit"]:hover { background: #1d4ed8; }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>Software Engineer</h1>
    <p class="subtitle">Acme Corp · Remote · Full-time</p>

    <form method="POST" action="/testform/submit">

      <div class="section-title">Personal Information</div>

      <div class="row">
        <div>
          <label for="first_name">First Name <span class="req">*</span></label>
          <input type="text" id="first_name" name="first_name" required placeholder="Jane">
        </div>
        <div>
          <label for="last_name">Last Name <span class="req">*</span></label>
          <input type="text" id="last_name" name="last_name" required placeholder="Smith">
        </div>
      </div>

      <label for="email">Email Address <span class="req">*</span></label>
      <input type="email" id="email" name="email" required placeholder="jane@example.com">

      <label for="phone">Phone Number <span class="req">*</span></label>
      <input type="tel" id="phone" name="phone" required placeholder="+1 (555) 000-0000">

      <label for="location">City / Location</label>
      <input type="text" id="location" name="location" placeholder="San Francisco, CA">

      <div class="section-title">Professional Details</div>

      <label for="linkedin">LinkedIn Profile URL</label>
      <input type="url" id="linkedin" name="linkedin" placeholder="https://linkedin.com/in/janesmith">

      <label for="portfolio">Portfolio / Website</label>
      <input type="url" id="portfolio" name="portfolio" placeholder="https://janesmith.dev">

      <label for="years_experience">Years of Experience <span class="req">*</span></label>
      <select id="years_experience" name="years_experience" required>
        <option value="">Select…</option>
        <option value="0-1">Less than 1 year</option>
        <option value="1-3">1–3 years</option>
        <option value="3-5">3–5 years</option>
        <option value="5-10">5–10 years</option>
        <option value="10+">10+ years</option>
      </select>

      <label for="employment_type">Preferred Employment Type <span class="req">*</span></label>
      <select id="employment_type" name="employment_type" required>
        <option value="">Select…</option>
        <option value="full_time">Full-time</option>
        <option value="part_time">Part-time</option>
        <option value="contract">Contract</option>
        <option value="freelance">Freelance</option>
      </select>

      <label for="salary">Salary Expectation (USD/year)</label>
      <input type="text" id="salary" name="salary" placeholder="e.g. 120000">

      <label for="start_date">Earliest Start Date</label>
      <input type="text" id="start_date" name="start_date" placeholder="e.g. Immediately">

      <div class="section-title">Application</div>

      <label for="cover_letter">Cover Letter <span class="req">*</span></label>
      <textarea id="cover_letter" name="cover_letter" required placeholder="Tell us why you're a great fit…"></textarea>

      <label for="referral">How did you hear about us?</label>
      <select id="referral" name="referral">
        <option value="">Select…</option>
        <option value="linkedin">LinkedIn</option>
        <option value="github">GitHub</option>
        <option value="twitter">Twitter / X</option>
        <option value="referral">Employee Referral</option>
        <option value="other">Other</option>
      </select>

      <button type="submit">Submit Application</button>
    </form>
  </div>
</div>
</body>
</html>
